name: ci

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - name: Code ophalen
        uses: actions/checkout@v7

      - name: installeer node.js
        uses: actions/setup-node@v7
        with:
          node-version: 24

      - name: tetsten uitvoeren
        run: npm test
